<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Windows Desktop</title>
  <!-- Win98 Retro Styling Framework -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <!-- Spotify Web Playback SDK -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #008080;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Pixelated MS Sans Serif', Arial, sans-serif;
      user-select: none;
      transition: background-image 0.2s ease-in-out;
    }

    /* Desktop Icons Area */
    .desktop {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 1;
    }

    .desktop-icon {
      width: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      color: white;
      text-shadow: 1px 1px #000;
      font-size: 11px;
      text-align: center;
    }

    .desktop-icon img {
      width: 32px;
      height: 32px;
      margin-bottom: 4px;
    }

    /* Draggable Window Wrapper */
    .window {
      position: absolute;
      z-index: 10;
    }

    .window .title-bar {
      cursor: move;
    }

    #player-window {
      width: 680px;
      top: 40px;
      left: 110px;
    }

    #clock-window {
      width: 220px;
      top: 40px;
      left: 810px;
    }

    #display-window {
      width: 300px;
      top: 200px;
      left: 810px;
    }

    #minesweeper-window {
      width: 260px;
      top: 150px;
      left: 450px;
    }

    .address-bar-container {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      margin-bottom: 6px;
    }

    .browser-content {
      background: #ffffff;
      box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
      height: 300px;
      overflow-y: auto;
      padding: 12px;
      color: black;
    }

    /* Grid Layout for Folder View */
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 16px;
      padding: 8px;
    }

    .folder-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      padding: 6px;
    }

    .folder-item:hover {
      background-color: #000080;
      color: white;
    }

    .folder-item img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      margin-bottom: 6px;
      border: 1px solid #808080;
      background-color: #c0c0c0;
    }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px;
      border-bottom: 1px dotted #808080;
    }

    .player-controls {
      margin-top: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .now-playing-banner {
      font-weight: bold;
      color: #000080;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #c0c0c0;
    }

    .clock-display {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      background: #000;
      color: #00ff00;
      padding: 10px;
      font-family: monospace;
      border: 2px inset #dfdfdf;
      transition: color 0.3s ease;
    }

    /* Minesweeper Styles */
    .ms-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #c0c0c0;
      border: 2px inset #fff;
      padding: 4px 8px;
      margin-bottom: 8px;
    }

    .ms-counter {
      background: #000;
      color: #ff0000;
      font-family: monospace;
      font-size: 18px;
      font-weight: bold;
      padding: 2px 6px;
      border: 1px inset #7d7d7d;
    }

    #ms-reset-btn {
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      font-size: 16px;
      min-width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ms-grid {
      display: grid;
      grid-template-columns: repeat(9, 24px);
      grid-template-rows: repeat(9, 24px);
      gap: 1px;
      background: #808080;
      border: 2px inset #fff;
      width: fit-content;
      margin: 0 auto;
    }

    .ms-cell {
      width: 24px;
      height: 24px;
      background: #c0c0c0;
      border: 2px outset #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      font-family: 'Segoe UI Emoji', sans-serif;
      cursor: pointer;
    }

    .ms-cell.revealed {
      border: 1px solid #7d7d7d;
      background: #bdbdbd;
    }

    /* Taskbar */
    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background: #c0c0c0;
      border-top: 2px solid #fff;
      display: flex;
      align-items: center;
      padding: 2px 4px;
      z-index: 100;
    }

    .taskbar-tray {
      margin-left: auto;
      border: 2px inset #fff;
      padding: 2px 8px;
      font-size: 11px;
      background: #c0c0c0;
    }
  </style>
</head>
<body id="desktop-body">

  <!-- Desktop Icons -->
  <div class="desktop">
    <div class="desktop-icon" onclick="toggleWindow('player-window')">
      <img src="https://win98icons.alexmeub.com/icons/png/internet_connection_wiz-0.png" alt="IE">
      <span>Spotify IE</span>
    </div>
    <div class="desktop-icon" onclick="toggleWindow('clock-window')">
      <img src="https://win98icons.alexmeub.com/icons/png/clock-0.png" alt="Clock">
      <span>Clock</span>
    </div>
    <div class="desktop-icon" onclick="toggleWindow('display-window')">
      <img src="https://win98icons.alexmeub.com/icons/png/display_properties-0.png" alt="Display">
      <span>Display</span>
    </div>
    <div class="desktop-icon" onclick="toggleWindow('minesweeper-window')">
      <img src="https://win98icons.alexmeub.com/icons/png/game_mine_1-0.png" alt="Minesweeper">
      <span>Minesweeper</span>
    </div>
  </div>

  <!-- SPOTIFY PLAYER WINDOW -->
  <div class="window" id="player-window">
    <div class="title-bar">
      <div class="title-bar-text">Internet Explorer - Retro Spotify Player</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize" onclick="toggleWindow('player-window')"></button>
        <button aria-label="Close" onclick="toggleWindow('player-window')"></button>
      </div>
    </div>

    <div class="window-body">
      <div class="address-bar-container">
        <button id="back-btn" onclick="navUp()">Up 📁</button>
        <label for="address">Address:</label>
        <input id="address" type="text" value="C:\Spotify" style="flex-grow: 1;" readonly>
      </div>

      <div class="browser-content" id="content-area">
        <div id="auth-section">
          <p>Welcome! Click below to authorize your Spotify Premium account.</p>
          <button id="login-btn">Connect Spotify</button>
        </div>

        <div id="explorer-section" style="display: none;">
          <div class="now-playing-banner" id="now-playing-title">Status: Idle</div>
          <div id="view-container"></div>
        </div>
      </div>

      <div class="field-row player-controls">
        <button id="play-btn">▶ Play</button>
        <button id="pause-btn">⏸ Pause</button>
        <button id="next-btn">⏭ Next</button>
        <button id="logout-btn" style="margin-left: auto;">Disconnect</button>
        <span style="font-size: 11px;">Status: <strong id="device-status">Disconnected</strong></span>
      </div>
    </div>
  </div>

  <!-- CLOCK GADGET WINDOW -->
  <div class="window" id="clock-window">
    <div class="title-bar">
      <div class="title-bar-text">Clock</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="toggleWindow('clock-window')"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="clock-display" id="gadget-clock">00:00:00 AM</div>
    </div>
  </div>

  <!-- DISPLAY PROPERTIES WINDOW -->
  <div class="window" id="display-window">
    <div class="title-bar">
      <div class="title-bar-text">Display Properties</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="toggleWindow('display-window')"></button>
      </div>
    </div>
    <div class="window-body">
      <p style="margin-top: 0; font-weight: bold;">Desktop Background:</p>
      <div class="field-row">
        <select id="wallpaper-select" style="width: 100%;">
          <option value="teal">Classic Win95 Teal</option>
          <option value="bliss">Windows Rolling Hills</option>
          <option value="clouds">Windows 95 Bliss</option>
        </select>
      </div>

      <p style="margin-top: 12px; margin-bottom: 4px; font-weight: bold;">Clock Color:</p>
      <div class="field-row">
        <select id="clock-color-select" style="width: 100%;">
          <option value="#00ff00">Matrix Green</option>
          <option value="#ffb000">Retro Amber</option>
          <option value="#00ffff">Classic Cyan</option>
          <option value="#ff69b4">Hot Pink</option>
          <option value="#ffffff">Crisp White</option>
        </select>
      </div>

      <div style="margin-top: 14px;" class="field-row">
        <button onclick="applyDisplaySettings()">Apply</button>
        <button onclick="toggleWindow('display-window')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- MINESWEEPER WINDOW -->
  <div class="window" id="minesweeper-window" style="display: none;">
    <div class="title-bar">
      <div class="title-bar-text">Minesweeper</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="toggleWindow('minesweeper-window')"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="ms-header">
        <div class="ms-counter" id="ms-mine-count">010</div>
        <button id="ms-reset-btn" onclick="initMinesweeper()">&#128578;</button>
        <div class="ms-counter" id="ms-timer">000</div>
      </div>
      <div class="ms-grid" id="ms-board"></div>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button style="font-weight: bold; display: flex; align-items: center; gap: 4px;">
      <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" width="14" height="14">
      Start
    </button>
    <div class="taskbar-tray" id="tray-clock">00:00 AM</div>
  </div>

  <script>
    const CLIENT_ID = '4692b9fae514427c9a94e6bde0d8e390'; 
    const REDIRECT_URI = 'https://angelica-commits-arson.github.io/'; 
    const SCOPES = 'user-read-recently-played user-library-read user-modify-playback-state streaming user-read-playback-state playlist-read-private playlist-read-collaborative';

    let spotifyPlayer = null;
    let activeDeviceId = null;
    let currentPath = 'root'; 

    const wallpapers = {
      teal: '',
      bliss: 'Windows-rolling-hills.jpg', 
      clouds: 'Windows_95_Bliss.jpg' 
    };

    const defaultFolderIcon = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 24 24' fill='%23e6c229'><path d='M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z'/></svg>";

    function applyDisplaySettings() {
      const selectedWallpaper = document.getElementById('wallpaper-select').value;
      const body = document.getElementById('desktop-body');
      if (selectedWallpaper === 'teal') {
        body.style.backgroundImage = 'none';
        body.style.backgroundColor = '#008080';
      } else {
        body.style.backgroundImage = `url('${wallpapers[selectedWallpaper]}')`;
      }

      const selectedColor = document.getElementById('clock-color-select').value;
      document.getElementById('gadget-clock').style.color = selectedColor;
    }

    // ==========================================
    // MINESWEEPER LOGIC
    // ==========================================
    const MS_ROWS = 9, MS_COLS = 9, MS_MINES = 10;
    let msBoard = [], msGameOver = false, msTimer = 0, msInterval = null, msFlags = 10;

    function initMinesweeper() {
      if (msInterval) {
        clearInterval(msInterval);
        msInterval = null;
      }
      msTimer = 0;
      msFlags = MS_MINES;
      msGameOver = false;
      document.getElementById('ms-timer').innerText = '000';
      document.getElementById('ms-mine-count').innerText = '010';
      document.getElementById('ms-reset-btn').innerHTML = '&#128578;'; // 🙂

      const boardEl = document.getElementById('ms-board');
      boardEl.innerHTML = '';
      msBoard = Array(MS_ROWS).fill(null).map(() => Array(MS_COLS).fill(null).map(() => ({
        mine: false, revealed: false, flagged: false, count: 0
      })));

      let planted = 0;
      while (planted < MS_MINES) {
        let r = Math.floor(Math.random() * MS_ROWS);
        let c = Math.floor(Math.random() * MS_COLS);
        if (!msBoard[r][c].mine) {
          msBoard[r][c].mine = true;
          planted++;
        }
      }

      for (let r = 0; r < MS_ROWS; r++) {
        for (let c = 0; c < MS_COLS; c++) {
          if (msBoard[r][c].mine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < MS_ROWS && nc >= 0 && nc < MS_COLS && msBoard[nr][nc].mine) {
                count++;
              }
            }
          }
          msBoard[r][c].count = count;
        }
      }

      for (let r = 0; r < MS_ROWS; r++) {
        for (let c = 0; c < MS_COLS; c++) {
          let cell = document.createElement('div');
          cell.className = 'ms-cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener('click', () => clickCell(r, c));
          cell.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            flagCell(r, c);
          });
          boardEl.appendChild(cell);
        }
      }
    }

    function startMsTimer() {
      if (!msInterval && !msGameOver) {
        msInterval = setInterval(() => {
          msTimer = Math.min(999, msTimer + 1);
          document.getElementById('ms-timer').innerText = String(msTimer).padStart(3, '0');
        }, 1000);
      }
    }

    function clickCell(r, c) {
      if (msGameOver || msBoard[r][c].flagged || msBoard[r][c].revealed) return;
      startMsTimer();

      let cellObj = msBoard[r][c];
      cellObj.revealed = true;
      let el = document.querySelector(`.ms-cell[data-row="${r}"][data-col="${c}"]`);
      el.classList.add('revealed');

      if (cellObj.mine) {
        el.innerText = '💣';
        el.style.background = '#ff0000';
        endGame(false);
        return;
      }

      if (cellObj.count > 0) {
        el.innerText = cellObj.count;
        const colors = ['', 'blue', 'green', 'red', 'darkblue', 'brown', 'teal', 'black', 'gray'];
        el.style.color = colors[cellObj.count];
      } else {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < MS_ROWS && nc >= 0 && nc < MS_COLS) {
              clickCell(nr, nc);
            }
          }
        }
      }

      checkWin();
    }

    function flagCell(r, c) {
      if (msGameOver || msBoard[r][c].revealed) return;
      startMsTimer();
      let cellObj = msBoard[r][c];
      let el = document.querySelector(`.ms-cell[data-row="${r}"][data-col="${c}"]`);

      if (!cellObj.flagged && msFlags > 0) {
        cellObj.flagged = true;
        el.innerText = '🚩';
        msFlags--;
      } else if (cellObj.flagged) {
        cellObj.flagged = false;
        el.innerText = '';
        msFlags++;
      }
      document.getElementById('ms-mine-count').innerText = String(msFlags).padStart(3, '0');
    }

    function checkWin() {
      let unrevealedNonMines = 0;
      for (let r = 0; r < MS_ROWS; r++) {
        for (let c = 0; c < MS_COLS; c++) {
          if (!msBoard[r][c].mine && !msBoard[r][c].revealed) unrevealedNonMines++;
        }
      }
      if (unrevealedNonMines === 0) endGame(true);
    }

    function endGame(won) {
      msGameOver = true;
      if (msInterval) {
        clearInterval(msInterval);
        msInterval = null;
      }
      document.getElementById('ms-reset-btn').innerHTML = won ? '&#128526;' : '&#128565;'; // 😎 or 😵

      for (let r = 0; r < MS_ROWS; r++) {
        for (let c = 0; c < MS_COLS; c++) {
          if (msBoard[r][c].mine) {
            let el = document.querySelector(`.ms-cell[data-row="${r}"][data-col="${c}"]`);
            if (!msBoard[r][c].flagged) el.innerText = '💣';
          }
        }
      }
    }

    initMinesweeper();

    // ==========================================
    // FOLDER & EXPLORER NAVIGATION SYSTEM
    // ==========================================
    function setAddressPath(path) {
      document.getElementById('address').value = `C:\\Spotify\\${path}`;
    }

    function renderRootView() {
      currentPath = 'root';
      setAddressPath('');
      const container = document.getElementById('view-container');
      container.innerHTML = `
        <div class="folder-grid">
          <div class="folder-item" onclick="loadPlaylistsFolder()">
            <img src="${defaultFolderIcon}">
            <span>Playlists</span>
          </div>
          <div class="folder-item" onclick="loadRecentTracks()">
            <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd-0.png" onerror="this.src='${defaultFolderIcon}'">
            <span>Recently Played</span>
          </div>
        </div>
      `;
    }

    async function loadPlaylistsFolder() {
      currentPath = 'playlists';
      setAddressPath('Playlists');
      const container = document.getElementById('view-container');
      container.innerHTML = '<p>Loading playlists...</p>';

      try {
        const token = await getValidAccessToken();
        const response = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (response.status === 401 || response.status === 403) {
          localStorage.clear();
          container.innerHTML = '<p>Session expired. <button onclick="redirectToSpotifyAuth()">Re-connect Spotify</button></p>';
          return;
        }

        const data = await response.json();
        container.innerHTML = '';

        if (data.items && data.items.length > 0) {
          const gridDiv = document.createElement('div');
          gridDiv.className = 'folder-grid';

          data.items.forEach(playlist => {
            const imgUrl = (playlist.images && playlist.images.length > 0) 
              ? playlist.images[0].url 
              : defaultFolderIcon;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'folder-item';
            itemDiv.dataset.id = playlist.id;
            itemDiv.dataset.uri = playlist.uri;
            itemDiv.dataset.name = playlist.name;

            itemDiv.innerHTML = `
              <img src="${imgUrl}" onerror="this.src='${defaultFolderIcon}'">
              <span>${playlist.name}</span>
            `;

            itemDiv.addEventListener('click', () => {
              loadPlaylistTracks(playlist.id, playlist.uri, playlist.name);
            });

            gridDiv.appendChild(itemDiv);
          });
          container.appendChild(gridDiv);
        } else {
          container.innerHTML = '<p>No playlists found in your account.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p>Error loading playlists. Please re-connect Spotify.</p>';
      }
    }

    async function loadPlaylistTracks(playlistId, playlistUri, playlistName) {
      currentPath = 'playlist_contents';
      setAddressPath(`Playlists\\${playlistName}`);
      const container = document.getElementById('view-container');
      container.innerHTML = '<p>Opening playlist...</p>';

      try {
        const token = await getValidAccessToken();
        const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=100`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        const data = await response.json();
        const tracksList = (data.items || []).filter(item => item && item.track);

        if (tracksList.length > 0) {
          let listHTML = '<ul style="list-style: none; padding: 0; margin: 0;">';
          tracksList.forEach((item, index) => {
            const track = item.track;
            const artistName = track.artists && track.artists.length > 0 ? track.artists[0].name : 'Unknown Artist';
            listHTML += `
              <li class="track-item">
                <span><strong>${track.name}</strong> - ${artistName}</span>
                <button onclick="playContext('${playlistUri}', ${index})">Play</button>
              </li>
            `;
          });
          listHTML += '</ul>';
          container.innerHTML = listHTML;
        } else {
          container.innerHTML = '<p>No playable tracks found in this playlist.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p>Error loading playlist tracks.</p>';
      }
    }

    async function loadRecentTracks() {
      currentPath = 'recent';
      setAddressPath('Recently Played');
      const container = document.getElementById('view-container');
      container.innerHTML = '<p>Loading tracks...</p>';

      try {
        const token = await getValidAccessToken();
        const response = await fetch('https://api.spotify.com/v1/me/player/recently-played?limit=20', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await response.json();

        let listHTML = '<ul style="list-style: none; padding: 0; margin: 0;">';
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const track = item.track;
            listHTML += `
              <li class="track-item">
                <span><strong>${track.name}</strong> - ${track.artists[0]?.name || 'Unknown Artist'}</span>
                <button onclick="playSingleTrack('${track.uri}')">Play</button>
              </li>
            `;
          });
        } else {
          listHTML += '<li>No recently played tracks.</li>';
        }
        listHTML += '</ul>';
        container.innerHTML = listHTML;
      } catch (err) {
        container.innerHTML = '<p>Error loading recent tracks.</p>';
      }
    }

    function navUp() {
      if (currentPath === 'playlist_contents') {
        loadPlaylistsFolder();
      } else if (currentPath === 'playlists' || currentPath === 'recent') {
        renderRootView();
      }
    }

    // ==========================================
    // WINDOW DRAGGING & TOGGLE LOGIC
    // ==========================================
    function makeDraggable(windowEl) {
      const header = windowEl.querySelector('.title-bar');
      let posX = 0, posY = 0, mouseX = 0, mouseY = 0;

      header.onmousedown = (e) => {
        e.preventDefault();
        mouseX = e.clientX;
        mouseY = e.clientY;
        
        document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
        windowEl.style.zIndex = 20;

        document.onmousemove = (e) => {
          e.preventDefault();
          posX = mouseX - e.clientX;
          posY = mouseY - e.clientY;
          mouseX = e.clientX;
          mouseY = e.clientY;
          windowEl.style.top = (windowEl.offsetTop - posY) + "px";
          windowEl.style.left = (windowEl.offsetLeft - posX) + "px";
        };

        document.onmouseup = () => {
          document.onmousemove = null;
          document.onmouseup = null;
        };
      };
    }

    document.querySelectorAll('.window').forEach(makeDraggable);

    function toggleWindow(id) {
      const el = document.getElementById(id);
      el.style.display = (el.style.display === 'none') ? 'block' : 'none';
    }

    function updateClocks() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const trayStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('gadget-clock').innerText = timeStr;
      document.getElementById('tray-clock').innerText = trayStr;
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // ==========================================
    // SPOTIFY PKCE AUTH & API LOGIC
    // ==========================================
    const generateRandomString = (length) => {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    };

    const sha256 = async (plain) => {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    };

    const base64encode = (input) => {
      return btoa(String.fromCharCode.apply(null, new Uint8Array(input)))
        .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    };

    async function redirectToSpotifyAuth() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);

      window.localStorage.setItem('code_verifier', codeVerifier);

      const params = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function fetchTokens(code) {
      const codeVerifier = localStorage.getItem('code_verifier');

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });

      const data = await response.json();
      saveTokens(data);
      window.history.replaceState({}, document.title, window.location.pathname);
      return data.access_token;
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('refresh_token');
      if (!refreshToken) return null;

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'refresh_token',
          refresh_token: refreshToken,
        }),
      });

      const data = await response.json();
      saveTokens(data);
      return data.access_token;
    }

    function saveTokens(data) {
      if (data.access_token) {
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('expires_at', Date.now() + (data.expires_in * 1000));
      }
      if (data.refresh_token) {
        localStorage.setItem('refresh_token', data.refresh_token);
      }
    }

    async function getValidAccessToken() {
      const expiresAt = localStorage.getItem('expires_at');
      const accessToken = localStorage.getItem('access_token');

      if (accessToken && Date.now() < Number(expiresAt)) {
        return accessToken;
      }

      if (localStorage.getItem('refresh_token')) {
        return await refreshAccessToken();
      }

      return null;
    }

    window.onSpotifyWebPlaybackSDKReady = async () => {
      const token = await getValidAccessToken();
      if (!token) return;

      spotifyPlayer = new Spotify.Player({
        name: 'Retro Win98 Browser Player',
        getOAuthToken: async cb => {
          const freshToken = await getValidAccessToken();
          cb(freshToken);
        },
        volume: 0.8
      });

      spotifyPlayer.addListener('ready', ({ device_id }) => {
        activeDeviceId = device_id;
        document.getElementById('device-status').innerText = 'Connected';
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('explorer-section').style.display = 'block';
        renderRootView();
      });

      spotifyPlayer.addListener('player_state_changed', state => {
        if (!state) return;
        const track = state.track_window.current_track;
        document.getElementById('now-playing-title').innerText = 
          `Playing: ${track.name} - ${track.artists[0]?.name || 'Unknown'}`;
      });

      spotifyPlayer.connect();
    };

    async function playContext(contextUri, trackPosition) {
      if (!activeDeviceId) return;
      const token = await getValidAccessToken();

      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${activeDeviceId}`, {
        method: 'PUT',
        body: JSON.stringify({ 
          context_uri: contextUri,
          offset: { position: trackPosition }
        }),
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
      });
    }

    async function playSingleTrack(uri) {
      if (!activeDeviceId) return;
      const token = await getValidAccessToken();

      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${activeDeviceId}`, {
        method: 'PUT',
        body: JSON.stringify({ uris: [uri] }),
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
      });
    }

    document.getElementById('login-btn').addEventListener('click', redirectToSpotifyAuth);
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.reload();
    });

    document.getElementById('play-btn').addEventListener('click', () => spotifyPlayer && spotifyPlayer.resume());
    document.getElementById('pause-btn').addEventListener('click', () => spotifyPlayer && spotifyPlayer.pause());
    document.getElementById('next-btn').addEventListener('click', () => spotifyPlayer && spotifyPlayer.nextTrack());

    async function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        await fetchTokens(code);
      } else {
        const token = await getValidAccessToken();
        if (token && window.Spotify) {
          window.onSpotifyWebPlaybackSDKReady();
        }
      }
    }

    initApp();
  </script>
</body>
</html>
