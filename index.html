<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro App Suite</title>
  <style>
    /* basic retro styling for table output */
    body { font-family: "MS Sans Serif", Tahoma, sans-serif; background-color: #008080; padding: 20px; }
    .window { background: #c0c0c0; border: 2px solid #fff; border-right-color: #000; border-bottom-color: #000; padding: 10px; margin-bottom: 15px; }
    .title-bar { background: #000080; color: white; padding: 3px; font-weight: bold; }
    .f1-table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 8px; font-size: 12px; }
    .f1-table th, .f1-table td { border: 1px solid #808080; padding: 4px; text-align: left; }
    .f1-table th { background: #dfdfdf; }
    .track-item { display: flex; justify-content: space-between; padding: 4px; border-bottom: 1px solid #ccc; background: #fff; }
  </style>
</head>
<body>

  <!-- RETRO SPOTIFY PLAYER -->
  <div class="window">
    <div class="title-bar">Internet Explorer - Retro Spotify Player</div>
    <div style="padding: 10px;">
      <div id="view-container">Select a playlist to load tracks.</div>
    </div>
  </div>

  <!-- FORMULA 1 ARCHIVES -->
  <div class="window">
    <div class="title-bar">Formula 1 Grand Prix Archives (1999 - Present)</div>
    <div style="padding: 10px;">
      <label>Year: </label>
      <select id="f1-year-select" onchange="onF1YearChange()"></select>

      <label>Race: </label>
      <select id="f1-race-select"></select>

      <button onclick="loadF1RaceResults()">Get Results</button>
      <button onclick="loadF1Standings()">🏆 Standings</button>

      <div id="f1-results-container" style="margin-top: 10px;">
        Select a year and race above to load official results.
      </div>
    </div>
  </div>

<script>
// ==========================================
// 1. FREE & OPEN F1 DATA ENGINE (f1api.dev)
// ==========================================
const F1_BASE_API = 'https://f1api.dev/api';

async function fetchF1Data(endpoint) {
  const res = await fetch(`${F1_BASE_API}${endpoint}`);
  if (!res.ok) {
    throw new Error(`F1 API Error ${res.status}: ${res.statusText}`);
  }
  return await res.json();
}

function initF1App() {
  const yearSelect = document.getElementById('f1-year-select');
  if (!yearSelect) return;
  
  const currentYear = new Date().getFullYear();
  yearSelect.innerHTML = '';
  
  // Build year dropdown list down to 1999
  for (let y = currentYear; y >= 1999; y--) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.innerText = y;
    yearSelect.appendChild(opt);
  }

  // Default to 2024 to guarantee completed historical data on launch
  yearSelect.value = '2024';
  onF1YearChange();
}

async function onF1YearChange() {
  const yearSelect = document.getElementById('f1-year-select');
  const raceSelect = document.getElementById('f1-race-select');
  if (!yearSelect || !raceSelect) return;

  const year = yearSelect.value;
  raceSelect.innerHTML = '<option value="">Loading schedule...</option>';

  try {
    const data = await fetchF1Data(`/${year}/races`);
    const races = data?.races || data?.data || [];

    raceSelect.innerHTML = '';
    if (races.length === 0) {
      raceSelect.innerHTML = '<option value="">No races found</option>';
      return;
    }

    races.forEach((race, index) => {
      const opt = document.createElement('option');
      opt.value = race.id || (index + 1);
      opt.innerText = `R${index + 1}: ${race.name || race.raceName}`;
      raceSelect.appendChild(opt);
    });

    loadF1RaceResults();
  } catch (err) {
    console.error('F1 Schedule Error:', err);
    raceSelect.innerHTML = '<option value="">Error loading schedule</option>';
  }
}

async function loadF1RaceResults() {
  const yearSelect = document.getElementById('f1-year-select');
  const raceSelect = document.getElementById('f1-race-select');
  const container = document.getElementById('f1-results-container');

  if (!yearSelect || !raceSelect || !container) return;

  const year = yearSelect.value;
  const raceId = raceSelect.value;

  if (!raceId) return;
  container.innerHTML = '<p>Fetching race results...</p>';

  try {
    const data = await fetchF1Data(`/${year}/races/${raceId}/results`);
    const results = data?.results || data?.data || [];

    if (results.length === 0) {
      container.innerHTML = '<p>No results found for this race.</p>';
      return;
    }

    let html = `
      <h4 style="margin-top:0; margin-bottom: 6px;">${year} Grand Prix Results</h4>
      <table class="f1-table">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Driver</th>
            <th>Constructor</th>
            <th>Laps</th>
            <th>Time / Status</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
    `;

    results.forEach(r => {
      const driverName = r.driver ? `${r.driver.givenName || r.driver.firstName || ''} ${r.driver.familyName || r.driver.lastName || ''}` : (r.driverName || 'Unknown');
      const team = r.constructor?.name || r.teamName || 'N/A';
      const status = r.time || r.status || 'Finished';
      
      html += `
        <tr>
          <td><strong>${r.position}</strong></td>
          <td>${driverName}</td>
          <td>${team}</td>
          <td>${r.laps || '-'}</td>
          <td>${status}</td>
          <td>${r.points || 0}</td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  } catch (err) {
    console.error('F1 Results Error:', err);
    container.innerHTML = '<p>Error loading race results.</p>';
  }
}

async function loadF1Standings() {
  const yearSelect = document.getElementById('f1-year-select');
  const container = document.getElementById('f1-results-container');
  if (!yearSelect || !container) return;

  const year = yearSelect.value;
  container.innerHTML = `<p>Loading ${year} Standings...</p>`;

  try {
    const data = await fetchF1Data(`/${year}/driver-standings`);
    const standings = data?.standings || data?.data || [];

    if (standings.length === 0) {
      container.innerHTML = `<p>No standings available for ${year}.</p>`;
      return;
    }

    let html = `
      <h4 style="margin-top:0; margin-bottom: 6px;">🏆 ${year} Drivers' Championship Standings</h4>
      <table class="f1-table">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Driver</th>
            <th>Constructor</th>
            <th>Wins</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
    `;

    standings.forEach(s => {
      const driverName = s.driver ? `${s.driver.givenName || s.driver.firstName || ''} ${s.driver.familyName || s.driver.lastName || ''}` : (s.driverName || 'Unknown');
      const team = s.constructor?.name || s.teamName || 'N/A';
      
      html += `
        <tr>
          <td><strong>${s.position}</strong></td>
          <td>${driverName}</td>
          <td>${team}</td>
          <td>${s.wins || 0}</td>
          <td><strong>${s.points}</strong></td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  } catch (err) {
    console.error('F1 Standings Error:', err);
    container.innerHTML = '<p>Error loading championship standings.</p>';
  }
}


// ==========================================
// 2. FIXED SPOTIFY PLAYLIST TRACK FETCH LOGIC
// ==========================================
async function loadPlaylistTracks(playlistId, playlistUri, playlistName) {
  const container = document.getElementById('view-container');
  if (!container) return;

  container.innerHTML = '<p>Opening playlist...</p>';

  try {
    const token = typeof getValidAccessToken === 'function' ? await getValidAccessToken() : null;
    if (!token) {
      container.innerHTML = '<p>Session expired. Please reconnect Spotify.</p>';
      return;
    }

    // Explicit market parameter prevents playlist track resolution errors
    const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?market=from_token&limit=100`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (!response.ok) {
      container.innerHTML = `<p>Error loading playlist (${response.status}). Click Disconnect and reconnect.</p>`;
      return;
    }

    const data = await response.json();
    const items = data.items || [];
    const validTracks = [];

    items.forEach(item => {
      const t = item.track || item.item || item;
      if (t && (t.name || t.title)) {
        const trackName = t.name || t.title;
        const artistName = (t.artists && t.artists.length > 0) 
          ? t.artists[0].name 
          : (t.show ? t.show.name : 'Unknown Artist');
        const uri = t.uri || playlistUri;

        validTracks.push({
          name: trackName,
          artist: artistName,
          uri: uri
        });
      }
    });

    if (validTracks.length > 0) {
      let listHTML = '<ul style="list-style: none; padding: 0; margin: 0;">';
      validTracks.forEach((track, index) => {
        listHTML += `
          <li class="track-item">
            <span><strong>${track.name}</strong> - ${track.artist}</span>
            <button onclick="if(typeof playContext === 'function') playContext('${playlistUri}', ${index})">Play</button>
          </li>
        `;
      });
      listHTML += '</ul>';
      container.innerHTML = listHTML;
    } else {
      container.innerHTML = '<p>No playable tracks found in this playlist.</p>';
    }
  } catch (err) {
    console.error('Playlist Track Exception:', err);
    container.innerHTML = '<p>Error loading playlist tracks.</p>';
  }
}

// Automatically boot up the F1 interface on page load
document.addEventListener('DOMContentLoaded', () => {
  initF1App();
});
</script>

</body>
</html>
