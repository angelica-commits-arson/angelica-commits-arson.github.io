<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Windows Desktop</title>
  <!-- Win98 Retro Styling Framework -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <!-- Spotify Web Playback SDK -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #008080;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Pixelated MS Sans Serif', Arial, sans-serif;
      user-select: none;
      transition: background-image 0.2s ease-in-out;
    }

    /* Desktop Icons Area */
    .desktop {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 1;
    }

    .desktop-icon {
      width: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      color: white;
      text-shadow: 1px 1px #000;
      font-size: 11px;
      text-align: center;
    }

    .desktop-icon img {
      width: 32px;
      height: 32px;
      margin-bottom: 4px;
    }

    /* Draggable Window Wrapper */
    .window {
      position: absolute;
      z-index: 10;
    }

    .window .title-bar {
      cursor: move;
    }

    #player-window {
      width: 680px;
      top: 40px;
      left: 110px;
    }

    #clock-window {
      width: 220px;
      top: 40px;
      left: 810px;
    }

    #display-window {
      width: 300px;
      top: 200px;
      left: 810px;
    }

    .address-bar-container {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      margin-bottom: 6px;
    }

    .browser-content {
      background: #ffffff;
      box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
      height: 300px;
      overflow-y: auto;
      padding: 12px;
      color: black;
    }

    /* Grid Layout for Folder View */
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 16px;
      padding: 8px;
    }

    .folder-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      padding: 6px;
    }

    .folder-item:hover {
      background-color: #000080;
      color: white;
    }

    .folder-item img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      margin-bottom: 6px;
    }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px;
      border-bottom: 1px dotted #808080;
    }

    .player-controls {
      margin-top: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .now-playing-banner {
      font-weight: bold;
      color: #000080;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #c0c0c0;
    }

    .clock-display {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      background: #000;
      color: #00ff00;
      padding: 10px;
      font-family: monospace;
      border: 2px inset #dfdfdf;
    }

    /* Taskbar */
    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background: #c0c0c0;
      border-top: 2px solid #fff;
      display: flex;
      align-items: center;
      padding: 2px 4px;
      z-index: 100;
    }

    .taskbar-tray {
      margin-left: auto;
      border: 2px inset #fff;
      padding: 2px 8px;
      font-size: 11px;
      background: #c0c0c0;
    }
  </style>
</head>
<body id="desktop-body">

  <!-- Desktop Icons -->
  <div class="desktop">
    <div class="desktop-icon" onclick="toggleWindow('player-window')">
      <img src="https://win98icons.alexmeub.com/icons/png/internet_connection_wiz-0.png" alt="IE">
      <span>Spotify IE</span>
    </div>
    <div class="desktop-icon" onclick="toggleWindow('clock-window')">
      <img src="https://win98icons.alexmeub.com/icons/png/clock-0.png" alt="Clock">
      <span>Clock</span>
    </div>
    <div class="desktop-icon" onclick="toggleWindow('display-window')">
      <img src="https://win98icons.alexmeub.com/icons/png/display_properties-0.png" alt="Display">
      <span>Display</span>
    </div>
  </div>

  <!-- 1. SPOTIFY PLAYER WINDOW -->
  <div class="window" id="player-window">
    <div class="title-bar">
      <div class="title-bar-text">Internet Explorer - Retro Spotify Player</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize" onclick="toggleWindow('player-window')"></button>
        <button aria-label="Close" onclick="toggleWindow('player-window')"></button>
      </div>
    </div>

    <div class="window-body">
      <!-- Address Bar Controls -->
      <div class="address-bar-container">
        <button id="back-btn" onclick="navUp()">Up 📁</button>
        <label for="address">Address:</label>
        <input id="address" type="text" value="C:\Spotify" style="flex-grow: 1;" readonly>
      </div>

      <!-- Main Directory Content -->
      <div class="browser-content" id="content-area">
        <div id="auth-section">
          <p>Welcome! Click below to authorize your Spotify Premium account.</p>
          <button id="login-btn">Connect Spotify</button>
        </div>

        <div id="explorer-section" style="display: none;">
          <div class="now-playing-banner" id="now-playing-title">Status: Idle</div>
          <div id="view-container"></div>
        </div>
      </div>

      <!-- Player Control Bar -->
      <div class="field-row player-controls">
        <button id="play-btn">▶ Play</button>
        <button id="pause-btn">⏸ Pause</button>
        <button id="next-btn">⏭ Next</button>
        <button id="logout-btn" style="margin-left: auto;">Disconnect</button>
        <span style="font-size: 11px;">Status: <strong id="device-status">Disconnected</strong></span>
      </div>
    </div>
  </div>

  <!-- 2. CLOCK GADGET WINDOW -->
  <div class="window" id="clock-window">
    <div class="title-bar">
      <div class="title-bar-text">Clock</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="toggleWindow('clock-window')"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="clock-display" id="gadget-clock">00:00:00 AM</div>
    </div>
  </div>

  <!-- 3. DISPLAY PROPERTIES WINDOW -->
  <div class="window" id="display-window">
    <div class="title-bar">
      <div class="title-bar-text">Display Properties</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="toggleWindow('display-window')"></button>
      </div>
    </div>
    <div class="window-body">
      <p style="margin-top: 0;">Select a Desktop Background:</p>
      
      <div class="field-row">
        <select id="wallpaper-select" style="width: 100%;">
          <option value="teal">Classic Win95 Teal</option>
          <option value="bliss">Windows XP (Bliss Hill)</option>
          <option value="clouds">Windows 95 Clouds</option>
        </select>
      </div>

      <div style="margin-top: 10px;" class="field-row">
        <button onclick="applyWallpaper()">Apply</button>
        <button onclick="toggleWindow('display-window')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button style="font-weight: bold; display: flex; align-items: center; gap: 4px;">
      <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" width="14" height="14">
      Start
    </button>
    <div class="taskbar-tray" id="tray-clock">00:00 AM</div>
  </div>

  <script>
    // Configuration Settings
    const CLIENT_ID = '4692b9fae514427c9a94e6bde0d8e390'; 
    const REDIRECT_URI = 'https://angelica-commits-arson.github.io/'; 
    const SCOPES = 'user-read-recently-played user-library-read user-modify-playback-state streaming user-read-playback-state playlist-read-private';

    let spotifyPlayer = null;
    let activeDeviceId = null;
    let currentPath = 'root'; // Navigation State: 'root', 'playlists', 'recent', or 'playlist_TRACK_ID'

    const wallpapers = {
      teal: '',
      bliss: 'https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28location_in_California%29.png',
      clouds: 'https://upload.wikimedia.org/wikipedia/commons/2/22/Clouds_%28Windows_95%29.png'
    };

    function applyWallpaper() {
      const selected = document.getElementById('wallpaper-select').value;
      const body = document.getElementById('desktop-body');
      
      if (selected === 'teal') {
        body.style.backgroundImage = 'none';
        body.style.backgroundColor = '#008080';
      } else {
        body.style.backgroundImage = `url('${wallpapers[selected]}')`;
      }
    }

    // ==========================================
    // FOLDER & EXPLORER NAVIGATION SYSTEM
    // ==========================================
    function setAddressPath(path) {
      document.getElementById('address').value = `C:\\Spotify\\${path}`;
    }

    function renderRootView() {
      currentPath = 'root';
      setAddressPath('');
      const container = document.getElementById('view-container');
      container.innerHTML = `
        <div class="folder-grid">
          <div class="folder-item" onclick="loadPlaylistsFolder()">
            <img src="https://win98icons.alexmeub.com/icons/png/directory_open_file_ydocs-4.png">
            <span>Playlists</span>
          </div>
          <div class="folder-item" onclick="loadRecentTracks()">
            <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd-0.png">
            <span>Recently Played</span>
          </div>
        </div>
      `;
    }

    async function loadPlaylistsFolder() {
      currentPath = 'playlists';
      setAddressPath('Playlists');
      const container = document.getElementById('view-container');
      container.innerHTML = '<p>Loading playlists...</p>';

      const token = await getValidAccessToken();
      const response = await fetch('https://api.spotify.com/v1/me/playlists?limit=20', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await response.json();

      let gridHTML = '<div class="folder-grid">';
      data.items.forEach(playlist => {
        const imgUrl = playlist.images[0]?.url || 'https://win98icons.alexmeub.com/icons/png/directory_open_file_ydocs-4.png';
        gridHTML += `
          <div class="folder-item" onclick="loadPlaylistTracks('${playlist.id}', '${escape(playlist.name)}')">
            <img src="${imgUrl}">
            <span>${playlist.name}</span>
          </div>
        `;
      });
      gridHTML += '</div>';
      container.innerHTML = gridHTML;
    }

    async function loadPlaylistTracks(playlistId, name) {
      currentPath = 'playlist_contents';
      setAddressPath(`Playlists\\${unescape(name)}`);
      const container = document.getElementById('view-container');
      container.innerHTML = '<p>Opening playlist...</p>';

      const token = await getValidAccessToken();
      const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=30`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await response.json();

      let listHTML = '<ul style="list-style: none; padding: 0; margin: 0;">';
      data.items.forEach(item => {
        if (!item.track) return;
        const track = item.track;
        listHTML += `
          <li class="track-item">
            <span><strong>${track.name}</strong> - ${track.artists[0].name}</span>
            <button onclick="playTrack('${track.uri}')">Play</button>
          </li>
        `;
      });
      listHTML += '</ul>';
      container.innerHTML = listHTML;
    }

    async function loadRecentTracks() {
      currentPath = 'recent';
      setAddressPath('Recently Played');
      const container = document.getElementById('view-container');
      container.innerHTML = '<p>Loading tracks...</p>';

      const token = await getValidAccessToken();
      const response = await fetch('https://api.spotify.com/v1/me/player/recently-played?limit=20', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await response.json();

      let listHTML = '<ul style="list-style: none; padding: 0; margin: 0;">';
      data.items.forEach(item => {
        const track = item.track;
        listHTML += `
          <li class="track-item">
            <span><strong>${track.name}</strong> - ${track.artists[0].name}</span>
            <button onclick="playTrack('${track.uri}')">Play</button>
          </li>
        `;
      });
      listHTML += '</ul>';
      container.innerHTML = listHTML;
    }

    function navUp() {
      if (currentPath === 'playlist_contents') {
        loadPlaylistsFolder();
      } else if (currentPath === 'playlists' || currentPath === 'recent') {
        renderRootView();
      }
    }

    // ==========================================
    // WINDOW DRAGGING & TOGGLE LOGIC
    // ==========================================
    function makeDraggable(windowEl) {
      const header = windowEl.querySelector('.title-bar');
      let posX = 0, posY = 0, mouseX = 0, mouseY = 0;

      header.onmousedown = (e) => {
        e.preventDefault();
        mouseX = e.clientX;
        mouseY = e.clientY;
        
        document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
        windowEl.style.zIndex = 20;

        document.onmousemove = (e) => {
          e.preventDefault();
          posX = mouseX - e.clientX;
          posY = mouseY - e.clientY;
          mouseX = e.clientX;
          mouseY = e.clientY;
          windowEl.style.top = (windowEl.offsetTop - posY) + "px";
          windowEl.style.left = (windowEl.offsetLeft - posX) + "px";
        };

        document.onmouseup = () => {
          document.onmousemove = null;
          document.onmouseup = null;
        };
      };
    }

    document.querySelectorAll('.window').forEach(makeDraggable);

    function toggleWindow(id) {
      const el = document.getElementById(id);
      el.style.display = (el.style.display === 'none') ? 'block' : 'none';
    }

    // Live Clock Update
    function updateClocks() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const trayStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('gadget-clock').innerText = timeStr;
      document.getElementById('tray-clock').innerText = trayStr;
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // ==========================================
    // SPOTIFY PKCE AUTH & API LOGIC
    // ==========================================
    const generateRandomString = (length) => {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    };

    const sha256 = async (plain) => {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    };

    const base64encode = (input) => {
      return btoa(String.fromCharCode.apply(null, new Uint8Array(input)))
        .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    };

    async function redirectToSpotifyAuth() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);

      window.localStorage.setItem('code_verifier', codeVerifier);

      const params = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function fetchTokens(code) {
      const codeVerifier = localStorage.getItem('code_verifier');

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });

      const data = await response.json();
      saveTokens(data);
      window.history.replaceState({}, document.title, window.location.pathname);
      return data.access_token;
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('refresh_token');
      if (!refreshToken) return null;

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'refresh_token',
          refresh_token: refreshToken,
        }),
      });

      const data = await response.json();
      saveTokens(data);
      return data.access_token;
    }

    function saveTokens(data) {
      if (data.access_token) {
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('expires_at', Date.now() + (data.expires_in * 1000));
      }
      if (data.refresh_token) {
        localStorage.setItem('refresh_token', data.refresh_token);
      }
    }

    async function getValidAccessToken() {
      const expiresAt = localStorage.getItem('expires_at');
      const accessToken = localStorage.getItem('access_token');

      if (accessToken && Date.now() < Number(expiresAt)) {
        return accessToken;
      }

      if (localStorage.getItem('refresh_token')) {
        return await refreshAccessToken();
      }

      return null;
    }

    window.onSpotifyWebPlaybackSDKReady = async () => {
      const token = await getValidAccessToken();
      if (!token) return;

      spotifyPlayer = new Spotify.Player({
        name: 'Retro Win98 Browser Player',
        getOAuthToken: async cb => {
          const freshToken = await getValidAccessToken();
          cb(freshToken);
        },
        volume: 0.8
      });

      spotifyPlayer.addListener('ready', ({ device_id }) => {
        activeDeviceId = device_id;
        document.getElementById('device-status').innerText = 'Connected';
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('explorer-section').style.display = 'block';
        renderRootView();
      });

      spotifyPlayer.addListener('player_state_changed', state => {
        if (!state) return;
        const track = state.track_window.current_track;
        document.getElementById('now-playing-title').innerText = 
          `Playing: ${track.name} - ${track.artists[0].name}`;
      });

      spotifyPlayer.connect();
    };

    async function playTrack(uri) {
      if (!activeDeviceId) return;
      const token = await getValidAccessToken();

      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${activeDeviceId}`, {
        method: 'PUT',
        body: JSON.stringify({ uris: [uri] }),
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
      });
    }

    // Button Listeners
    document.getElementById('login-btn').addEventListener('click', redirectToSpotifyAuth);
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.reload();
    });

    document.getElementById('play-btn').addEventListener('click', () => spotifyPlayer && spotifyPlayer.resume());
    document.getElementById('pause-btn').addEventListener('click', () => spotifyPlayer && spotifyPlayer.pause());
    document.getElementById('next-btn').addEventListener('click', () => spotifyPlayer && spotifyPlayer.nextTrack());

    async function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        await fetchTokens(code);
      } else {
        const token = await getValidAccessToken();
        if (token && window.Spotify) {
          window.onSpotifyWebPlaybackSDKReady();
        }
      }
    }

    initApp();
  </script>
</body>
</html>
